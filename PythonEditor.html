<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Python Editor 网页版</title>

<style>
:root {
    --theme-1: #2983cc;
    --theme-2: #4a9eff;
    --href: #2983cc;
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-xl: 8px;
    --bg: #202020;
    --card: #2b2b2b;
    --hover: #383838;
    --hover-b: #444;
    --s3d: rgba(0, 0, 0, 0.2);
    --text: #e8e8e8;
    --text-dim: #9a9a9a;
    --border: #3c3c3c;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
}

.window.pythonEditor {
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--card);
    overflow: hidden;
}

.window.pythonEditor .titbar {
    display: flex;
    align-items: center;
    height: 40px;
    padding: 0 12px;
    background: #2d2d2d;
    border-bottom: 1px solid var(--border);
    user-select: none;
    flex-shrink: 0;
}
.window.pythonEditor .titbar .icon {
    width: 20px;
    height: 20px;
    margin-right: 10px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23377ab3' d='M12 2C6.5 2 6 4.5 6 6v3h6v1H4.5C2.5 10 1 11.5 1 14s1.5 4 3.5 4H7v-3c0-1.5 1.5-3 3-3h6c1.5 0 3-1.5 3-3V6c0-1.5-1.5-4-7-4zM9 4.5a1 1 0 110 2 1 1 0 010-2z'/><path fill='%23f7c948' d='M12 22c5.5 0 6-2.5 6-4v-3h-6v-1h7.5c2 0 3.5-1.5 3.5-4s-1.5-4-3.5-4H17v3c0 1.5-1.5 3-3 3H8c-1.5 0-3 1.5-3 3v3c0 1.5 1.5 4 7 4zm3-2.5a1 1 0 110-2 1 1 0 010 2z'/></svg>") center/contain no-repeat;
}
.window.pythonEditor .titbar p {
    margin: 0;
    font-size: 14px;
    flex: 1;
}
.window.pythonEditor .titbar .run {
    font-size: 17px;
    padding: 4px 14px;
    background: var(--theme-1);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1;
    height: 28px;
}
.window.pythonEditor .titbar .run:hover { background: var(--theme-2); }
.window.pythonEditor .titbar .run:disabled { background: #555; cursor: not-allowed; }
.window.pythonEditor .titbar .run i { font-style: normal; font-size: 12px; }

#win-pythonEditor {
    display: grid;
    grid-template-rows: 60% 40%;
    min-height: 0;
    flex: 1;
    -webkit-user-select: all;
    user-select: all;
}

#monaco-editor {
    width: 100%;
    height: 100%;
}

#win-pythonEditor .output {
    background-color: #0f0f0f;
    color: #f8f8f2;
    border: 25px solid #1a1a1a !important;
    border: none;
    padding: 10px;
    width: 100%;
    height: 100%;
    font: 14px / normal 'Consolas', 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', 'Source Code Pro', 'source-code-pro', monospace;
    overflow-y: scroll;
    white-space: pre-wrap;
    word-wrap: break-word;
    -webkit-user-select: auto;
    user-select: auto;
    outline: none;
    margin: 0;
}
#win-pythonEditor .output::selection {
    background: #ddd;
    background-clip: content-box;
    color: #333;
}
#win-pythonEditor .output .error { color: #f48771; }
#win-pythonEditor .output .success { color: #89d185; }
#win-pythonEditor .output .info { color: #569cd6; }

.statusbar {
    height: 24px;
    background: #2d2d2d;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 12px;
    color: var(--text-dim);
    gap: 16px;
    flex-shrink: 0;
}
.statusbar .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f0ad4e;
    display: inline-block;
    margin-right: 6px;
    transition: background 0.3s;
}
.statusbar .dot.ready { background: #89d185; }
.statusbar .dot.error { background: #f48771; }
</style>
</head>

<body>

<div class="window pythonEditor">
    <div class="titbar">
        <div class="icon"></div>
        <p>Python Editor</p>
        <button class="run" id="run-btn" disabled>
            <i>▶</i> 运行
        </button>
    </div>

    <div id="win-pythonEditor">
        <div id="monaco-editor"></div>
        <pre class="output" id="output">正在加载 Pyodide...</pre>
    </div>

    <div class="statusbar">
        <span><span class="dot" id="status-dot"></span><span id="status-text">加载中</span></span>
        <span id="cursor-info">行 1, 列 1</span>
        <span style="margin-left:auto;">Ctrl+Enter 运行 · Tab 缩进</span>
    </div>
</div>

<!-- 1. 先加载 Pyodide -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>

<!-- 2. 再加载 Monaco Editor -->
<script src="https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js"></script>

<script>
const DEFAULT_CODE = `import math

def greet(name):
    return f"Hello, {name}!"

if __name__ == "__main__":
    print(greet("World"))
    print("Pi =", math.pi)
`;

let editor = null;
let pyodide = null;
const runBtn = document.getElementById('run-btn');
const outputEl = document.getElementById('output');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const cursorInfo = document.getElementById('cursor-info');

function setStatus(text, cls) {
    statusText.textContent = text;
    statusDot.className = 'dot' + (cls ? ' ' + cls : '');
}

// ===== 注册 Python 补全提供者 =====
function registerPythonCompletions(monaco) {
    // Python 内置函数和关键字
    const PYTHON_BUILTINS = [
        'abs', 'all', 'any', 'ascii', 'bin', 'bool', 'breakpoint', 'bytearray', 'bytes',
        'callable', 'chr', 'classmethod', 'compile', 'complex', 'delattr', 'dict', 'dir',
        'divmod', 'enumerate', 'eval', 'exec', 'filter', 'float', 'format', 'frozenset',
        'getattr', 'globals', 'hasattr', 'hash', 'help', 'hex', 'id', 'input', 'int',
        'isinstance', 'issubclass', 'iter', 'len', 'list', 'locals', 'map', 'max',
        'memoryview', 'min', 'next', 'object', 'oct', 'open', 'ord', 'pow', 'print',
        'property', 'range', 'repr', 'reversed', 'round', 'set', 'setattr', 'slice',
        'sorted', 'staticmethod', 'str', 'sum', 'super', 'tuple', 'type', 'vars', 'zip'
    ];
    const PYTHON_KEYWORDS = [
        'and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue', 'def',
        'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global', 'if',
        'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise',
        'return', 'try', 'while', 'with', 'yield', 'True', 'False', 'None'
    ];
    const PYTHON_SNIPPETS = [
        { label: 'def', insertText: 'def ${1:function_name}(${2:args}):\n    ${3:pass}', documentation: '定义函数' },
        { label: 'class', insertText: 'class ${1:ClassName}:\n    def __init__(self${2:, args}):\n        ${3:pass}', documentation: '定义类' },
        { label: 'if', insertText: 'if ${1:condition}:\n    ${2:pass}', documentation: 'if 语句' },
        { label: 'for', insertText: 'for ${1:item} in ${2:iterable}:\n    ${3:pass}', documentation: 'for 循环' },
        { label: 'while', insertText: 'while ${1:condition}:\n    ${2:pass}', documentation: 'while 循环' },
        { label: 'try', insertText: 'try:\n    ${1:pass}\nexcept ${2:Exception} as e:\n    ${3:pass}', documentation: 'try-except 块' },
        { label: 'with', insertText: 'with ${1:expression} as ${2:var}:\n    ${3:pass}', documentation: 'with 语句' },
        { label: 'import', insertText: 'import ${1:module}', documentation: '导入模块' },
        { label: 'from', insertText: 'from ${1:module} import ${2:name}', documentation: '从模块导入' },
        { label: 'main', insertText: 'if __name__ == "__main__":\n    ${1:main()}', documentation: '主程序入口' }
    ];

    // 注册补全项提供者
    monaco.languages.registerCompletionItemProvider('python', {
        triggerCharacters: ['.', '@', '"', "'"],
        provideCompletionItems: function (model, position) {
            const word = model.getWordUntilPosition(position);
            const range = {
                startLineNumber: position.lineNumber,
                endLineNumber: position.lineNumber,
                startColumn: word.startColumn,
                endColumn: word.endColumn
            };

            // 检查是否在导入语句中
            const lineContent = model.getLineContent(position.lineNumber);
            const isImportLine = /^\s*(import|from)\s/.test(lineContent);

            const suggestions = [];

            // 关键字
            PYTHON_KEYWORDS.forEach(kw => {
                suggestions.push({
                    label: kw,
                    kind: monaco.languages.CompletionItemKind.Keyword,
                    insertText: kw,
                    range: range,
                    detail: '关键字'
                });
            });

            // 内置函数
            PYTHON_BUILTINS.forEach(fn => {
                suggestions.push({
                    label: fn,
                    kind: monaco.languages.CompletionItemKind.Function,
                    insertText: fn + '($0)',
                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                    range: range,
                    detail: '内置函数',
                    documentation: `Python 内置函数 ${fn}()`
                });
            });

            // 代码片段
            PYTHON_SNIPPETS.forEach(sn => {
                suggestions.push({
                    label: sn.label,
                    kind: monaco.languages.CompletionItemKind.Snippet,
                    insertText: sn.insertText,
                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                    range: range,
                    detail: '代码片段',
                    documentation: sn.documentation
                });
            });

            // 如果是 import 行，添加常用模块
            if (isImportLine) {
                const COMMON_MODULES = [
                    'math', 'os', 'sys', 'json', 're', 'random', 'datetime', 'time',
                    'collections', 'itertools', 'functools', 'typing', 'pathlib',
                    'csv', 'sqlite3', 'urllib', 'http', 'html', 'xml', 'logging',
                    'unittest', 'threading', 'multiprocessing', 'asyncio'
                ];
                COMMON_MODULES.forEach(mod => {
                    suggestions.push({
                        label: mod,
                        kind: monaco.languages.CompletionItemKind.Module,
                        insertText: mod,
                        range: range,
                        detail: '常用模块',
                        documentation: `Python 标准库模块 ${mod}`
                    });
                });
            }

            return { suggestions: suggestions };
        }
    });

    // 注册悬停提示
    monaco.languages.registerHoverProvider('python', {
        provideHover: function (model, position) {
            const word = model.getWordAtPosition(position);
            if (!word) return null;

            const wordText = word.word;

            // 关键字提示
            const keywordDocs = {
                'def': 'def: 定义一个函数。\n\n语法: def function_name(parameters):\n    statements',
                'class': 'class: 定义一个类。\n\n语法: class ClassName:\n    def __init__(self):\n        pass',
                'if': 'if: 条件语句。\n\n语法: if condition:\n    statements\nelif condition:\n    statements\nelse:\n    statements',
                'for': 'for: 遍历循环。\n\n语法: for item in iterable:\n    statements',
                'while': 'while: 条件循环。\n\n语法: while condition:\n    statements',
                'import': 'import: 导入模块。\n\n语法: import module_name',
                'from': 'from: 从模块导入特定内容。\n\n语法: from module import name',
                'return': 'return: 从函数返回值。\n\n语法: return expression',
                'try': 'try: 异常处理。\n\n语法: try:\n    statements\nexcept Exception:\n    statements'
            };

            if (keywordDocs[wordText]) {
                return {
                    range: new monaco.Range(
                        position.lineNumber, word.startColumn,
                        position.lineNumber, word.endColumn
                    ),
                    contents: [
                        { value: '**' + wordText + '**' },
                        { value: keywordDocs[wordText] }
                    ]
                };
            }

            // 内置函数提示
            const builtinDocs = {
                'print': 'print(*objects, sep=" ", end="\\n", file=sys.stdout, flush=False)\n\n打印对象到文本流。',
                'len': 'len(s)\n\n返回对象的长度（元素个数）。',
                'range': 'range(stop)\nrange(start, stop[, step])\n\n生成一个整数序列。',
                'int': 'int(x=0, base=10)\n\n将字符串或数字转换为整数。',
                'str': 'str(object="")\n\n返回对象的字符串表示。',
                'float': 'float(x=0.0)\n\n将字符串或数字转换为浮点数。',
                'list': 'list(iterable=())\n\n创建一个列表。',
                'dict': 'dict(**kwargs)\n\n创建一个字典。',
                'set': 'set(iterable=())\n\n创建一个集合。',
                'tuple': 'tuple(iterable=())\n\n创建一个元组。',
                'input': 'input([prompt])\n\n从标准输入读取一行。',
                'type': 'type(object)\n\n返回对象的类型。',
                'isinstance': 'isinstance(object, classinfo)\n\n判断对象是否是指定类型的实例。',
                'sum': 'sum(iterable, start=0)\n\n对可迭代对象中的元素求和。',
                'max': 'max(iterable, *[, key, default])\n\n返回最大值。',
                'min': 'min(iterable, *[, key, default])\n\n返回最小值。',
                'abs': 'abs(x)\n\n返回绝对值。',
                'round': 'round(number[, ndigits])\n\n四舍五入。',
                'sorted': 'sorted(iterable, *, key=None, reverse=False)\n\n返回排序后的列表。',
                'enumerate': 'enumerate(iterable, start=0)\n\n返回索引和值的枚举对象。',
                'zip': 'zip(*iterables)\n\n将多个可迭代对象打包成元组。',
                'map': 'map(function, iterable, ...)\n\n对每个元素应用函数。',
                'filter': 'filter(function, iterable)\n\n过滤元素。',
                'open': 'open(file, mode="r", buffering=-1, ...)\n\n打开文件。',
                'help': 'help([object])\n\n显示帮助信息。',
                'dir': 'dir([object])\n\n返回对象的属性列表。'
            };

            if (builtinDocs[wordText]) {
                return {
                    range: new monaco.Range(
                        position.lineNumber, word.startColumn,
                        position.lineNumber, word.endColumn
                    ),
                    contents: [
                        { value: '**' + wordText + '**' },
                        { value: builtinDocs[wordText] }
                    ]
                };
            }

            return null;
        }
    });

    console.log('Python 补全与提示已注册');
}

// ===== 初始化 Monaco Editor =====
require.config({
    paths: { vs: 'https://unpkg.com/monaco-editor@0.45.0/min/vs' }
});

require(['vs/editor/editor.main'], function () {
    editor = monaco.editor.create(document.getElementById('monaco-editor'), {
        value: DEFAULT_CODE,
        language: 'python',
        theme: 'vs-dark',
        fontSize: 16,
        lineHeight: 22,
        fontFamily: "'Consolas', 'Monaco', 'Menlo', 'Ubuntu Mono', 'Courier New', monospace",
        fontLigatures: false,
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        automaticLayout: true,
        tabSize: 4,
        insertSpaces: true,
        renderWhitespace: 'selection',
        smoothScrolling: true,
        cursorBlinking: 'smooth',
        cursorSmoothCaretAnimation: 'on',
        padding: { top: 10, bottom: 10 },
        quickSuggestions: {
            other: true,
            comments: false,
            strings: false
        },
        suggestOnTriggerCharacters: true,
        wordBasedSuggestions: 'currentDocument',
        bracketPairColorization: { enabled: true },
        guides: {
            bracketPairs: true,
            indentation: true
        },
        lineNumbers: 'on',
        glyphMargin: false,
        folding: true,
        scrollbar: {
            verticalScrollbarSize: 10,
            horizontalScrollbarSize: 10
        }
    });

    // 注册 Python 补全和提示
    registerPythonCompletions(monaco);

    // 光标位置更新
    editor.onDidChangeCursorPosition((e) => {
        cursorInfo.textContent = `行 ${e.position.lineNumber}, 列 ${e.position.column}`;
    });

    // Ctrl+Enter 运行
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, () => {
        runCode();
    });

    // Tab 缩进
    editor.addCommand(monaco.KeyCode.Tab, () => {
        editor.trigger('keyboard', 'type', { text: '    ' });
    });

    editor.focus();
    console.log('Monaco Editor 已就绪，主题：vs-dark');
});

// ===== Pyodide 加载 =====
async function waitForPyodide(timeout = 15000) {
    const start = Date.now();
    while (typeof loadPyodide !== 'function') {
        if (Date.now() - start > timeout) {
            throw new Error('Pyodide 加载超时');
        }
        await new Promise(r => setTimeout(r, 100));
    }
}

(async function initPyodide() {
    try {
        await waitForPyodide();
        pyodide = await loadPyodide();
        await pyodide.runPythonAsync(`
import sys, io
sys.stdout = io.StringIO()
sys.stderr = io.StringIO()
`);
        outputEl.textContent = 'Pyodide 已就绪，点击「运行」执行代码。';
        setStatus('就绪', 'ready');
        runBtn.disabled = false;
    } catch (e) {
        outputEl.innerHTML = `<span class="error">Pyodide 加载失败：${e.message}</span>`;
        setStatus('加载失败', 'error');
    }
})();

// ===== 运行逻辑 =====
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

async function runCode() {
    if (!pyodide || !editor) return;
    runBtn.disabled = true;
    setStatus('运行中...', '');
    outputEl.innerHTML = '';

    const code = editor.getValue();

    try {
        await pyodide.runPythonAsync(`
import sys, io
sys.stdout = io.StringIO()
sys.stderr = io.StringIO()
`);

        // 用 Python 自己的 try/except 捕获，把 traceback 写进 stderr
        const wrappedCode = `
import traceback
try:
${code.split('\n').map(l => '    ' + l).join('\n')}
except Exception:
    traceback.print_exc()
`;

        await pyodide.runPythonAsync(wrappedCode);

        const stdout = await pyodide.runPythonAsync('sys.stdout.getvalue()');
        const stderr = await pyodide.runPythonAsync('sys.stderr.getvalue()');

        let html = '';
        if (stdout) html += escapeHtml(stdout);
        if (stderr) html += `<span class="error">${escapeHtml(stderr)}</span>`;
        outputEl.innerHTML = html || '<span class="info">（无输出）</span>';

        setStatus(stderr ? '运行出错' : '运行完成', stderr ? 'error' : 'ready');
    } catch (e) {
        // 这里只会捕获到 JS 层面的错误（极少见）
        outputEl.innerHTML = `<span class="error">${escapeHtml(e.message || String(e))}</span>`;
        setStatus('运行出错', 'error');
    } finally {
        runBtn.disabled = false;
    }
}

runBtn.onclick = runCode;
</script>

</body>
</html>
